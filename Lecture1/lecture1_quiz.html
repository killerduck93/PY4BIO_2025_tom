<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecture 1 — Python for Bioinformatics: MCQ Quiz</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12131a;
      --ink: #e9eef5;
      --muted: #b8c1d1;
      --accent: #6ea8fe;
      --ok: #38c172;
      --bad: #ff6b6b;
      --warn: #ffb020;
      --card: #171924;
      --border: #2a2f3a;
      --focus: #99c2ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color: var(--accent); }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px; }
    header { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, rgba(11,12,16,.98) 0%, rgba(11,12,16,.92) 100%); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; align-items: center; gap: 16px; padding-block: 14px; }
    .title { font-weight: 700; letter-spacing: .3px; }
    .subtitle { color: var(--muted); font-size: .95rem; }

    .progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
    .bar { width: 180px; height: 8px; background: #202432; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar>span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #9ad0ff); transition: width .2s ease; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .controls { position: sticky; bottom: 0; z-index: 4; background: linear-gradient(180deg, rgba(11,12,16,0) 0%, rgba(11,12,16,1) 40% 100%); padding-top: 24px; }
    .controls .panel { display: flex; gap: 12px; align-items: center; justify-content: space-between; }

    button { appearance: none; border: 1px solid var(--border); background: var(--accent); color: #0b1220; font-weight: 700; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: transform .02s ease, filter .2s ease; }
    button.secondary { background: #23283a; color: var(--ink); }
    button.ghost { background: transparent; color: var(--ink); }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .question { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .question h3 { margin: 0 0 10px; font-size: 1.05rem; }
    .qid { font-weight: 700; color: var(--muted); margin-right: 6px; }
    .choices { display: grid; gap: 8px; margin-top: 8px; }

    .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: #121420; }
    .choice:hover { border-color: #33405a; }

    input[type="radio"] { appearance: none; width: 18px; height: 18px; border: 2px solid #5a6b86; border-radius: 999px; margin-top: 2px; position: relative; outline: none; }
    input[type="radio"]:focus { box-shadow: 0 0 0 3px rgba(153, 194, 255, .35); border-color: var(--focus); }
    input[type="radio"]:checked::after { content: ""; position: absolute; inset: 3px; border-radius: 999px; background: var(--accent); }

    .feedback { margin-top: 10px; font-size: .95rem; display: none; padding: 10px; border-radius: 10px; }
    .question.correct .feedback { display: block; background: rgba(56, 193, 114, .12); border: 1px solid rgba(56, 193, 114, .3); }
    .question.incorrect .feedback { display: block; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }

    .question.correct { border-color: rgba(56, 193, 114, .5); }
    .question.incorrect { border-color: rgba(255, 107, 107, .5); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .badge.ok { background: rgba(56,193,114,.18); color: #9af2bf; border: 1px solid rgba(56,193,114,.45); }
    .badge.bad { background: rgba(255,107,107,.18); color: #ffc1c1; border: 1px solid rgba(255,107,107,.45); }

    .result { display: none; }
    .result.visible { display: block; }
    .result h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .result .scorebig { font-size: 2.2rem; font-weight: 800; letter-spacing: .5px; }

    .hint { color: var(--muted); font-size: .95rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <div class="title">Lecture 1 — Python for Bioinformatics</div>
        <div class="subtitle">Multiple-Choice Quiz (20 questions)</div>
      </div>
      <div class="progress" aria-live="polite">
        <span class="hint">Answered:</span>
        <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
        <div><span id="answeredCount">0</span>/<span id="totalCount">20</span></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="intro" class="panel" style="margin-bottom: 16px;">
      <p>Choose one answer for each question. Click <strong>Check answers</strong> to see your score and explanations. You can <strong>Reset</strong> to try again.</p>
      <p class="hint">Tip: you can navigate with Tab and arrow keys; labels are clickable.</p>
    </section>

    <form id="quizForm" novalidate>
      <div class="grid" id="questions">
        <!-- Questions will be injected here by JavaScript -->
      </div>

      <div class="controls">
        <div class="panel">
          <div>
            <button type="submit" id="submitBtn">Check answers</button>
            <button type="button" class="secondary" id="resetBtn">Reset</button>
            <button type="button" class="ghost" id="printBtn">Print / Save PDF</button>
          </div>
          <div id="result" class="result" aria-live="polite"></div>
        </div>
      </div>
    </form>
  </main>

  <template id="questionTmpl">
    <div class="question" data-qid="">
      <h3><span class="qid"></span><span class="qtext"></span></h3>
      <div class="choices"></div>
      <div class="feedback"></div>
    </div>
  </template>

  <script>
    const DATA = [
      { id: 1, q: 'Which of the following is <strong>not</strong> listed as a Python property in the slides?', opts: ['Interpreted language','Object-oriented','Compiled-only language','Cross-platform'], correct: 2, expl: 'Python is described as interpreted, object-oriented, cross-platform, etc.—not compiled-only.' },
      { id: 2, q: 'Python was developed in the early 1990s by:', opts: ['Bjarne Stroustrup','Guido van Rossum','James Gosling','Dennis Ritchie'], correct: 1, expl: 'Guido van Rossum created Python.' },
      { id: 3, q: 'According to the slides, Python was named after:', opts: ['A species of snake','A Monty Python comedy show','An asteroid','A Unix command'], correct: 1, expl: 'It references “Monty Python’s Flying Circus.”' },
      { id: 4, q: 'The CPU can directly access which type of memory?', opts: ['Hard disk','Optical disc','Main memory (RAM)','Flash drive'], correct: 2, expl: 'The CPU directly accesses main memory (RAM); secondary memory is not direct.' },
      { id: 5, q: 'The “fetch–decode–execute” cycle happens in which order?', opts: ['Execute → Decode → Fetch','Decode → Fetch → Execute','Fetch → Decode → Execute','Fetch → Execute → Decode'], correct: 2, expl: 'The order is Fetch, then Decode, then Execute.' },
      { id: 6, q: 'Interpreted languages typically…', opts: ['Translate once to machine code and run standalone','Require both the interpreter and source each time they run','Cannot be run interactively','Are always faster than compiled languages'], correct: 1, expl: 'They need the interpreter and source at runtime.' },
      { id: 7, q: 'In software development, the step that includes fixing bugs is:', opts: ['Formulate Requirements','Determine Specifications','Test/Debug the Program','Maintain the Program'], correct: 2, expl: 'Testing/debugging is where bugs are identified and fixed.' },
      { id: 8, q: 'In <code>print("Hello", end=\':\')</code>, the <code>end</code> argument:', opts: ['Adds a newline automatically','Suppresses output','Replaces the default newline with <code>:</code>','Prints <code>end</code> literally'], correct: 2, expl: 'The <code>end</code> parameter replaces the trailing newline.' },
      { id: 9, q: '“Programs execute in sequential order” appears in the slides as a:', opts: ['Python error message','Snippet of Wisdom','PEP 8 rule','Course exercise'], correct: 1, expl: 'It appears under “Snippet of Wisdom 1.”' },
      { id: 10, q: 'What does the modulus (<code>%</code>) operator return?', opts: ['The quotient of division','The remainder of division','The power of a number','The floor of a float'], correct: 1, expl: 'The modulus returns the remainder.' },
      { id: 11, q: 'In Python truthiness shown in the slides, which evaluates as <strong>true</strong> in an <code>if</code> test?', opts: ['<code>False</code>','<code>0</code>','<code>-99</code>','<code>None</code>'], correct: 2, expl: '<code>-99</code> is truthy; <code>False</code>, <code>0</code>, and <code>None</code> are falsy.' },
      { id: 12, q: 'Which expression correctly tests even/odd as used in the slides?', opts: ['<code>count // 2 == 0</code>','<code>count % 2 == 0</code>','<code>count ** 2 == 0</code>','<code>count / 2 == 0</code>'], correct: 1, expl: 'Using modulus 2 equals zero tests even numbers.' },
      { id: 13, q: 'What does <code>rstrip()</code> do in the file-processing examples?', opts: ['Removes leading whitespace only','Removes trailing newline/whitespace','Removes all spaces in the line','Strips both ends and lowercases text'], correct: 1, expl: '<code>rstrip()</code> is used to strip the trailing newline/whitespace.' },
      { id: 14, q: 'In the file-reading example <code>for line in open("sequence.txt")</code>, the loop:', opts: ['Reads the entire file into memory first','Iterates line by line over the file','Skips blank lines by default','Requires <code>readlines()</code> to work'], correct: 1, expl: 'It iterates line by line; no need for <code>readlines()</code>.' },
      { id: 15, q: 'Which formatted string centers a name within 10 characters (as shown)?', opts: ['<code>"Yes, {:>10s} is my name."</code>','<code>"Yes, {:10s} is my name."</code>','<code>"Yes, {:^10s} is my name."</code>','<code>"Yes, {:<10s} is my name."</code>'], correct: 2, expl: '<code>{:^10s}</code> centers within width 10.' },
      { id: 16, q: 'Regarding <code>%i</code> vs <code>%d</code> for integers in output:', opts: ['<code>%i</code> and <code>%d</code> are the same for output in Python','<code>%i</code> prints binary, <code>%d</code> prints decimal','<code>%i</code> is deprecated; only <code>%d</code> works','<code>%d</code> prints hexadecimal, <code>%i</code> prints decimal'], correct: 0, expl: 'In Python string formatting with <code>%</code>, <code>%i</code> and <code>%d</code> behave the same for integers.' },
      { id: 17, q: 'Which built-in type is <strong>immutable</strong>?', opts: ['<code>set</code>','<code>frozenset</code>','<code>list</code>','<code>dict</code>'], correct: 1, expl: '<code>frozenset</code> is the immutable variant of <code>set</code>.' },
      { id: 18, q: 'Which statement best matches the slides?', opts: ['Only numbers are objects in Python','Everything in Python is an object','Only strings and lists are objects','Only user-defined classes are objects'], correct: 1, expl: 'Everything in Python is an object.' },
      { id: 19, q: 'What’s the recommended indentation in Python per the slides?', opts: ['Tabs only','2 spaces','4 spaces','Any whitespace; consistency not required'], correct: 2, expl: 'Use 4 spaces for indentation.' },
      { id: 20, q: 'The shebang line (e.g., <code>#!/usr/bin/env python3</code>) in a Python script is:', opts: ['Mandatory for Python to run','Optional metadata for how to invoke the interpreter','A comment that breaks on Linux','Required only on Windows'], correct: 1, expl: 'It is optional and indicates how to invoke the interpreter on Unix-like systems.' }
    ];

    const questionsEl = document.getElementById('questions');
    const tmpl = document.getElementById('questionTmpl');
    const resultEl = document.getElementById('result');
    const form = document.getElementById('quizForm');
    const answeredCountEl = document.getElementById('answeredCount');
    const totalCountEl = document.getElementById('totalCount');
    const barFillEl = document.getElementById('barFill');

    totalCountEl.textContent = DATA.length;

    function renderQuestions() {
      questionsEl.innerHTML = '';
      DATA.forEach((item, idx) => {
        const node = tmpl.content.cloneNode(true);
        const q = node.querySelector('.question');
        q.dataset.qid = item.id;
        q.id = `q${item.id}`;
        node.querySelector('.qid').textContent = `${item.id}) `;
        node.querySelector('.qtext').innerHTML = item.q;
        const choices = node.querySelector('.choices');
        item.opts.forEach((opt, i) => {
          const choiceId = `q${item.id}_${i}`;
          const wrap = document.createElement('label');
          wrap.className = 'choice';
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `q${item.id}`;
          radio.value = i;
          radio.id = choiceId;
          radio.addEventListener('change', updateProgress);
          const text = document.createElement('div');
          text.innerHTML = `<strong>${String.fromCharCode(65+i)}.</strong> <span>${opt}</span>`;
          wrap.appendChild(radio);
          wrap.appendChild(text);
          choices.appendChild(wrap);
        });
        questionsEl.appendChild(node);
      });
    }

    function getSelections() {
      const entries = [];
      DATA.forEach(item => {
        const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
        entries.push({ id: item.id, choice: selected ? Number(selected.value) : null });
      });
      return entries;
    }

    function updateProgress() {
      const selections = getSelections();
      const answered = selections.filter(s => s.choice !== null).length;
      answeredCountEl.textContent = answered;
      const pct = Math.round((answered / DATA.length) * 100);
      barFillEl.style.width = pct + '%';
    }

    function grade() {
      const selections = getSelections();
      let correct = 0;
      let unanswered = 0;

      selections.forEach(sel => {
        const meta = DATA.find(d => d.id === sel.id);
        const card = document.getElementById(`q${sel.id}`);
        card.classList.remove('correct','incorrect');
        const fb = card.querySelector('.feedback');
        if (sel.choice === null) {
          unanswered++;
          fb.innerHTML = `<span class="badge bad">Unanswered</span> Please select an option.\n<BR>${meta.expl}`;
          card.classList.add('incorrect');
        } else if (sel.choice === meta.correct) {
          correct++;
          fb.innerHTML = `<span class=\"badge ok\">Correct</span> ${meta.expl}`;
          card.classList.add('correct');
        } else {
          const letter = ['A','B','C','D'][meta.correct];
          fb.innerHTML = `<span class=\"badge bad\">Incorrect</span> Correct answer: <strong>${letter}</strong>. ${meta.expl}`;
          card.classList.add('incorrect');
        }
      });

      const scorePct = Math.round((correct / DATA.length) * 100);
      resultEl.classList.add('visible');
      resultEl.innerHTML = `
        <h2>Your result</h2>
        <div class="scorebig">${correct}/${DATA.length} (<strong>${scorePct}%</strong>)</div>
        <div class="hint">${unanswered ? (unanswered + ' unanswered question' + (unanswered>1?'s':'')) : 'All questions answered.'}</div>
      `;
      document.getElementById('submitBtn').textContent = 'Re-check';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
      form.reset();
      document.querySelectorAll('.question').forEach(q => q.classList.remove('correct','incorrect'));
      document.querySelectorAll('.feedback').forEach(f => f.textContent = '');
      resultEl.classList.remove('visible');
      resultEl.innerHTML = '';
      document.getElementById('submitBtn').textContent = 'Check answers';
      updateProgress();
    }

    document.getElementById('resetBtn').addEventListener('click', resetQuiz);
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      grade();
    });

    renderQuestions();
    updateProgress();
  </script>
</body>
</html>
