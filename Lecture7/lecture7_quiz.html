<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecture 7 — Python & SQL: MCQ Quiz</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12131a;
      --ink: #e9eef5;
      --muted: #b8c1d1;
      --accent: #6ea8fe;
      --ok: #38c172;
      --bad: #ff6b6b;
      --warn: #ffb020;
      --card: #171924;
      --border: #2a2f3a;
      --focus: #99c2ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color: var(--accent); }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px; }
    header { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, rgba(11,12,16,.98) 0%, rgba(11,12,16,.92) 100%); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; align-items: center; gap: 16px; padding-block: 14px; }
    .title { font-weight: 700; letter-spacing: .3px; }
    .subtitle { color: var(--muted); font-size: .95rem; }

    .progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
    .bar { width: 180px; height: 8px; background: #202432; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar>span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #9ad0ff); transition: width .2s ease; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .controls { position: sticky; bottom: 0; z-index: 4; background: linear-gradient(180deg, rgba(11,12,16,0) 0%, rgba(11,12,16,1) 40% 100%); padding-top: 24px; }
    .controls .panel { display: flex; gap: 12px; align-items: center; justify-content: space-between; }

    button { appearance: none; border: 1px solid var(--border); background: var(--accent); color: #0b1220; font-weight: 700; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: transform .02s ease, filter .2s ease; }
    button.secondary { background: #23283a; color: var(--ink); }
    button.ghost { background: transparent; color: var(--ink); }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .question { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .question h3 { margin: 0 0 10px; font-size: 1.05rem; }
    .qid { font-weight: 700; color: var(--muted); margin-right: 6px; }
    .choices { display: grid; gap: 8px; margin-top: 8px; }

    .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: #121420; }
    .choice:hover { border-color: #33405a; }

    input[type="radio"] { appearance: none; width: 18px; height: 18px; border: 2px solid #5a6b86; border-radius: 999px; margin-top: 2px; position: relative; outline: none; }
    input[type="radio"]:focus { box-shadow: 0 0 0 3px rgba(153, 194, 255, .35); border-color: var(--focus); }
    input[type="radio"]:checked::after { content: ""; position: absolute; inset: 3px; border-radius: 999px; background: var(--accent); }

    .feedback { margin-top: 10px; font-size: .95rem; display: none; padding: 10px; border-radius: 10px; }
    .question.correct .feedback { display: block; background: rgba(56, 193, 114, .12); border: 1px solid rgba(56, 193, 114, .3); }
    .question.incorrect .feedback { display: block; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }

    .question.correct { border-color: rgba(56, 193, 114, .5); }
    .question.incorrect { border-color: rgba(255, 107, 107, .5); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .badge.ok { background: rgba(56,193,114,.18); color: #9af2bf; border: 1px solid rgba(56,193,114,.45); }
    .badge.bad { background: rgba(255,107,107,.18); color: #ffc1c1; border: 1px solid rgba(255,107,107,.45); }

    .result { display: none; }
    .result.visible { display: block; }
    .result h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .result .scorebig { font-size: 2.2rem; font-weight: 800; letter-spacing: .5px; }

    .hint { color: var(--muted); font-size: .95rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <div class="title">Lecture 7 — Python &amp; SQL</div>
        <div class="subtitle">Multiple-Choice Quiz (20 questions)</div>
      </div>
      <div class="progress" aria-live="polite">
        <span class="hint">Answered:</span>
        <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
        <div><span id="answeredCount">0</span>/<span id="totalCount">20</span></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="intro" class="panel" style="margin-bottom: 16px;">
      <p>Choose one answer for each question. Click <strong>Check answers</strong> to see your score and explanations. You can <strong>Reset</strong> to try again.</p>
      <p class="hint">These questions are based on the Lecture 7 slides (Python &amp; SQL). fileciteturn0file0</p>
      <div id="devTests" class="sr-only" aria-live="polite"></div>
    </section>

    <form id="quizForm" novalidate>
      <div class="grid" id="questions">
        <!-- Questions will be injected here by JavaScript -->
      </div>

      <div class="controls">
        <div class="panel">
          <div>
            <button type="submit" id="submitBtn">Check answers</button>
            <button type="button" class="secondary" id="resetBtn">Reset</button>
            <button type="button" class="ghost" id="printBtn">Print / Save PDF</button>
          </div>
          <div id="result" class="result" aria-live="polite"></div>
        </div>
      </div>
    </form>
  </main>

  <template id="questionTmpl">
    <div class="question" data-qid="">
      <h3><span class="qid"></span><span class="qtext"></span></h3>
      <div class="choices"></div>
      <div class="feedback"></div>
    </div>
  </template>

  <script>
    const DATA = [
      { id: 1, q: 'Relational databases model data primarily as:', opts: ['Documents with nested fields', 'Graphs of nodes and edges', 'Tables of rows and columns', 'Key–value pairs only'], correct: 2, expl: 'Slides define relational databases as storing rows and columns in tables. fileciteturn0file0' },
      { id: 2, q: 'In the provided terminology, a <em>tuple</em> corresponds to a:', opts: ['Column describing an attribute', 'Row representing an object', 'Complete database file', 'B-tree index page'], correct: 1, expl: 'A tuple (row) represents an object such as a person or track. fileciteturn0file0' },
      { id: 3, q: 'Which of the following is <strong>not</strong> one of the core SQL operations listed?', opts: ['Create data (INSERT)', 'Retrieve data (SELECT)', 'Transpile data (TRANSPILATE)', 'Delete data (DELETE)'], correct: 2, expl: 'The slides list Create/Retrieve/Update/Delete; “Transpile” is not an SQL operation. fileciteturn0file0' },
      { id: 4, q: 'According to the slides, which statement about SQLite is true?', opts: ['It requires a separate server daemon to run.', 'It is unsuitable for small applications.', 'It is popular, free, fast, and embedded (incl. Python).', 'It only runs on Windows.'], correct: 2, expl: 'Slides emphasize SQLite is popular, free, fast, small, and embedded; Python ships with <code>sqlite3</code>. fileciteturn0file0' },
      { id: 5, q: 'What is the role of an <strong>index</strong> as described?', opts: ['Enforce foreign keys automatically', 'Encrypt table contents', 'Let the DBMS skip to (or near) the right row for faster lookup', 'Reduce table file size'], correct: 2, expl: 'Indexes help the DBMS “skip to the right row,” akin to address-book tabs. fileciteturn0file0' },
      { id: 6, q: 'In the example <code>session</code> table definition from the slides, which statement is correct?', opts: ['<code>speaker_id</code> is the PRIMARY KEY.', '<code>name</code> is the PRIMARY KEY of the table.', '<code>duration</code> is stored as TEXT.', '<code>speaker_id</code> allows NULL values.'], correct: 1, expl: 'The example defines PRIMARY KEY(name) and a UNIQUE, NOT NULL <code>speaker_id</code>. fileciteturn0file0' },
      { id: 7, q: 'Which operator does SQLite use to concatenate strings (e.g., last and first name)?', opts: ['<code>+</code>', '<code>CONCAT()</code>', '<code>||</code>', '<code>&amp;</code>'], correct: 2, expl: 'Concatenation uses the <code>||</code> operator in examples like <code>last_name || ", " || first_name</code>. fileciteturn0file0' },
      { id: 8, q: 'Which WHERE clause matches rows whose description contains “using”?', opts: ['<code>WHERE description LIKE "using"</code>', '<code>WHERE description LIKE "%using%"</code>', '<code>WHERE description = "%using%"</code>', '<code>WHERE description ILIKE "%using%"</code>'], correct: 1, expl: 'The slides use wildcards: <code>LIKE &apos;%using%&apos;</code>. fileciteturn0file0' },
      { id: 9, q: 'Which SQLite function returns both date and time in one value?', opts: ['<code>current_date</code>', '<code>current_time</code>', '<code>current_timestamp</code>', '<code>now()</code>'], correct: 2, expl: 'Examples include <code>current_date</code>, <code>current_time</code>, and <code>current_timestamp</code>; the latter includes both. fileciteturn0file0' },
      { id: 10, q: 'In the LEFT JOIN example, adding <code>WHERE session.name IS NULL</code> yields:', opts: ['Only sessions without speakers', 'Speakers without sessions', 'All speakers and sessions (cartesian)', 'Only matched speaker–session pairs'], correct: 1, expl: 'Filtering NULLs on the right table after a LEFT JOIN returns rows with no match (speakers without sessions). fileciteturn0file0' },
      { id: 11, q: 'In Python’s <code>sqlite3</code> workflow, which object do you use to execute SQL statements?', opts: ['The connection object directly', 'A <code>cursor</code> obtained from the connection', 'A <code>Statement</code> object', 'An <code>Engine</code> object'], correct: 1, expl: 'Steps: connect → create a cursor → execute queries → close/handle exceptions. fileciteturn0file0' },
      { id: 12, q: 'Why should you use <em>parameterized</em> queries (placeholders like <code>?</code>) in Python/SQLite?', opts: ['To speed up disk I/O', 'To randomize result order', 'To pass runtime values safely and mitigate SQL injection', 'Because SQLite refuses literals'], correct: 2, expl: 'Slides recommend placeholders for runtime values and to avoid SQL injection concerns. fileciteturn0file0' },
      { id: 13, q: 'Which cursor method efficiently inserts many rows in one call?', opts: ['<code>execute</code>', '<code>executemany</code>', '<code>writemany</code>', '<code>commitmany</code>'], correct: 1, expl: 'Bulk inserts/updates/deletes are demonstrated with <code>cursor.executemany()</code>. fileciteturn0file0' },
      { id: 14, q: 'Which method retrieves exactly one row (or <code>null</code> / <code>None</code> if no more rows)?', opts: ['<code>fetchall()</code>', '<code>fetchmany()</code>', '<code>fetchone()</code>', '<code>readrow()</code>'], correct: 2, expl: '<code>cursor.fetchone()</code> returns a single record or None. fileciteturn0file0' },
      { id: 15, q: 'After executing an <code>UPDATE</code> or <code>DELETE</code> in Python, what must you do to persist the change?', opts: ['Call <code>rollback()</code>', 'Call <code>commit()</code>', 'Close the cursor', 'Reopen the connection'], correct: 1, expl: 'Slides repeatedly commit after data-changing statements. fileciteturn0file0' },
      { id: 16, q: 'Which exception class do the examples use to catch SQLite errors?', opts: ['<code>sqlite3.Exception</code>', '<code>sqlite3.Error</code>', '<code>DatabaseError</code>', '<code>IOError</code>'], correct: 1, expl: 'Examples wrap DB code with try/except using <code>sqlite3.Error</code>. fileciteturn0file0' },
      { id: 17, q: 'Which of the following is <strong>not</strong> one of SQLite\'s storage classes listed in the slides?', opts: ['<code>NULL</code>', '<code>REAL</code>', '<code>BOOLEAN</code>', '<code>BLOB</code>'], correct: 2, expl: 'Slides list NULL, INTEGER, REAL, TEXT, and BLOB; BOOLEAN is not listed. fileciteturn0file0' },
      { id: 18, q: 'Why use an AUTOINCREMENT integer key (e.g., <code>speaker_id</code>)?', opts: ['To store long text efficiently', 'To speed up string concatenation', 'To provide unique “line numbers” that make linking (joining) tables easier', 'To compress the database file'], correct: 2, expl: 'Slides liken it to ledger line numbers to facilitate linking tables in queries. fileciteturn0file0' },
      { id: 19, q: 'Which statement (from the slides) creates a copy table from an existing table\'s rows?', opts: ['<code>CLONE TABLE speaker TO speaker_copy;</code>', '<code>CREATE TABLE speaker_copy LIKE speaker;</code>', '<code>CREATE TABLE speaker_copy AS SELECT * FROM speaker WHERE 1;</code>', '<code>DUPLICATE speaker INTO speaker_copy;</code>'], correct: 2, expl: 'The example uses <code>CREATE TABLE speaker_copy AS SELECT * FROM speaker WHERE 1;</code>. fileciteturn0file0' },
      { id: 20, q: 'What\'s the correct way to pass a single parameter to <code>cursor.execute</code> in Python?', opts: ['<code>cursor.execute(sql, speaker_id)</code>', '<code>cursor.execute(sql, [speaker_id])</code>', '<code>cursor.execute(sql, (speaker_id,))</code>', '<code>cursor.execute(sql)</code> then <code>cursor.bind(speaker_id)</code>'], correct: 2, expl: 'Examples show <code>cursor.execute(sql, (speaker_id,))</code> — a 1-tuple with a trailing comma. fileciteturn0file0' }
    ];

    const questionsEl = document.getElementById('questions');
    const tmpl = document.getElementById('questionTmpl');
    const resultEl = document.getElementById('result');
    const form = document.getElementById('quizForm');
    const answeredCountEl = document.getElementById('answeredCount');
    const totalCountEl = document.getElementById('totalCount');
    const barFillEl = document.getElementById('barFill');

    totalCountEl.textContent = DATA.length;

    function renderQuestions() {
      questionsEl.innerHTML = '';
      DATA.forEach((item, idx) => {
        const node = tmpl.content.cloneNode(true);
        const q = node.querySelector('.question');
        q.dataset.qid = item.id;
        q.id = `q${item.id}`;
        node.querySelector('.qid').textContent = `${item.id}) `;
        node.querySelector('.qtext').innerHTML = item.q;
        const choices = node.querySelector('.choices');
        item.opts.forEach((opt, i) => {
          const choiceId = `q${item.id}_${i}`;
          const wrap = document.createElement('label');
          wrap.className = 'choice';
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `q${item.id}`;
          radio.value = i;
          radio.id = choiceId;
          radio.addEventListener('change', updateProgress);
          const text = document.createElement('div');
          text.innerHTML = `<strong>${String.fromCharCode(65+i)}.</strong> <span>${opt}</span>`;
          wrap.appendChild(radio);
          wrap.appendChild(text);
          choices.appendChild(wrap);
        });
        questionsEl.appendChild(node);
      });
    }

    function getSelections() {
      const entries = [];
      DATA.forEach(item => {
        const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
        entries.push({ id: item.id, choice: selected ? Number(selected.value) : null });
      });
      return entries;
    }

    function updateProgress() {
      const selections = getSelections();
      const answered = selections.filter(s => s.choice !== null).length;
      answeredCountEl.textContent = answered;
      const pct = Math.round((answered / DATA.length) * 100);
      barFillEl.style.width = pct + '%';
    }

    function grade() {
      const selections = getSelections();
      let correct = 0;
      let unanswered = 0;

      selections.forEach(sel => {
        const meta = DATA.find(d => d.id === sel.id);
        const card = document.getElementById(`q${sel.id}`);
        card.classList.remove('correct','incorrect');
        const fb = card.querySelector('.feedback');
        if (sel.choice === null) {
          unanswered++;
          fb.innerHTML = `<span class="badge bad">Unanswered</span> Please select an option.\n<BR>${meta.expl}`;
          card.classList.add('incorrect');
        } else if (sel.choice === meta.correct) {
          correct++;
          fb.innerHTML = `<span class=\"badge ok\">Correct</span> ${meta.expl}`;
          card.classList.add('correct');
        } else {
          const letter = ['A','B','C','D'][meta.correct];
          fb.innerHTML = `<span class=\"badge bad\">Incorrect</span> Correct answer: <strong>${letter}</strong>. ${meta.expl}`;
          card.classList.add('incorrect');
        }
      });

      const scorePct = Math.round((correct / DATA.length) * 100);
      resultEl.classList.add('visible');
      resultEl.innerHTML = `
        <h2>Your result</h2>
        <div class="scorebig">${correct}/${DATA.length} (<strong>${scorePct}%</strong>)</div>
        <div class="hint">${unanswered ? (unanswered + ' unanswered question' + (unanswered>1?'s':'')) : 'All questions answered.'}</div>
      `;
      document.getElementById('submitBtn').textContent = 'Re-check';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
      form.reset();
      document.querySelectorAll('.question').forEach(q => q.classList.remove('correct','incorrect'));
      document.querySelectorAll('.feedback').forEach(f => f.textContent = '');
      resultEl.classList.remove('visible');
      resultEl.innerHTML = '';
      document.getElementById('submitBtn').textContent = 'Check answers';
      updateProgress();
    }

    document.getElementById('resetBtn').addEventListener('click', resetQuiz);
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      grade();
    });

    // ---------------------------
    // Developer self-tests ("test cases")
    // ---------------------------
    (function runSelfTests(){
      const out = [];
      function t(name, fn){
        try { fn(); out.push({ test: name, status: 'ok' }); }
        catch (e) { out.push({ test: name, status: 'FAIL', error: e.message }); }
      }
      t('DATA has 20 questions', () => { if (DATA.length !== 20) throw new Error(`Expected 20, got ${DATA.length}`); });
      t('Every question has 4 options', () => {
        DATA.forEach((q,i)=>{ if(!Array.isArray(q.opts) || q.opts.length!==4){ throw new Error(`Q${q.id||i} has ${q.opts&&q.opts.length} options`);} });
      });
      t('Correct index is valid', () => { DATA.forEach((q,i)=>{ if(!(Number.isInteger(q.correct) && q.correct>=0 && q.correct<4)) throw new Error(`Q${q.id||i} invalid correct index ${q.correct}`); }); });
      t('IDs are unique', ()=>{ const ids = DATA.map(q=>q.id); const set = new Set(ids); if(set.size!==ids.length) throw new Error('Duplicate IDs'); });
      // Surface results non-intrusively
      const el = document.getElementById('devTests');
      if (out.some(r=>r.status==='FAIL')) {
        el.textContent = 'Developer checks: some FAILED — see console for details.';
        console.table(out);
      } else {
        el.textContent = 'Developer checks: all passed.';
        console.table(out);
      }
    })();

    renderQuestions();
    updateProgress();
  </script>
</body>
</html>
